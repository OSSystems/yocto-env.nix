name: "Update packages"
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oelint
            attrs: oelint-parser oelint-adv
            summary: the `oelint-adv` and `oelint-parser` packages
          # fetchPypi builds a files.pythonhosted.org URL for wheels, which
          # nix-update cannot map back to a project; name the project directly.
          - name: bitbake-setup
            attrs: bitbake-setup
            extra: --url mirror://pypi/b/bitbake-setup
            summary: the `bitbake-setup` package
          # --build fails the job instead of opening a pull request when a new
          # release breaks the kas-patches.
          - name: kas
            attrs: kas
            extra: --build
            summary: the `kas` package
    steps:
      - uses: ossystems/nix-actions@v1
        id: nix
        with:
          install-nix: true
          token-owner: OSSystems
          app-id: ${{ vars.UPDATE_PACKAGES_APP_ID }}
          app-private-key: ${{ secrets.UPDATE_PACKAGES_APP_PRIVATE_KEY }}
          flake-check: false
          build-hosts: false
          build-devshells: false
      - name: Update ${{ matrix.name }}
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base=$(git rev-parse HEAD)

          for attr in ${{ matrix.attrs }}; do
            nix run nixpkgs#nix-update -- --flake --version=stable ${{ matrix.extra }} --commit "$attr"
          done

          if [ "$(git rev-parse HEAD)" != "$base" ]; then
            nix fmt
            git diff --quiet || git commit --all --amend --no-edit
          fi

          subjects=$(git log --reverse --format=%s "$base..HEAD")
          title=${subjects//$'\n'/, }
          echo "title=${title:-${{ matrix.name }}: no update available}" >>"$GITHUB_OUTPUT"
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.nix.outputs.token }}
          branch: update/${{ matrix.name }}
          delete-branch: true
          title: ${{ steps.update.outputs.title }}
          commit-message: ${{ steps.update.outputs.title }}
          body: |
            Automated daily bump of ${{ matrix.summary }} to the latest upstream
            release.
